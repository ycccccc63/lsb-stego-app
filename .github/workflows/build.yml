name: Build Windows EXE

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install streamlit pillow numpy matplotlib pyinstaller

      - name: Generate Entry Script
        run: |
          Set-Content -Path run_app.py -Value @"
          import sys
          import streamlit.web.cli as stcli

          if __name__ == '__main__':
              sys.argv = ['streamlit', 'run', 'app.py', '--global.developmentMode=false']
              sys.exit(stcli.main())
          "@

      - name: Build Executable
        run: |
          pyinstaller --noconsole --onefile --copy-metadata streamlit --collect-data streamlit run_app.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: LSB-System-EXE
          path: dist/run_app.exe
